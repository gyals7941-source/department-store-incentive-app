<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<script>
// 통행증 보관함 — 이 브라우저의 저장소(localStorage)에 통행증을 넣고 꺼낸다.
// Streamlit Cloud 는 쿠키를 앱에 넘겨주지 않아서 쿠키 대신 이 방식을 쓴다.
var KEY = "incentive_pass", last = null;
function post(type, data) {
  window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, data), "*");
}
window.addEventListener("message", function (e) {
  if (!e.data || e.data.type !== "streamlit:render") return;
  var a = e.data.args || {}, v = "";
  try {
    if (a.action === "set") { localStorage.setItem(KEY, a.value || ""); v = a.value || ""; }
    else if (a.action === "clear") { localStorage.removeItem(KEY); v = ""; }
    else { v = localStorage.getItem(KEY) || ""; }
  } catch (err) { v = ""; }
  var sig = a.action + "|" + v;
  if (sig !== last) { last = sig; post("streamlit:setComponentValue", {value: v, dataType: "json"}); }
});
post("streamlit:componentReady", {apiVersion: 1});
post("streamlit:setFrameHeight", {height: 0});
</script>
</body></html>
